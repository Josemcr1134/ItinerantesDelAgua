<div class="page" [class.page--water]="tone() === 'water'">
  <header class="page__brand">
    <img
      class="page__logo"
      alt="Escuela Itinerante del Agua"
      [src]="logo().src"
      [width]="logo().width"
      [height]="logo().height"
    />
  </header>

  <!-- Ilustraciones de cada pantalla (detrás de la tarjeta). -->
  <ng-content select="[accessDecor]" />

  <main class="page__main">
    <section class="card" [class.card--wide]="wide()" [attr.aria-labelledby]="labelledBy()">
      <ng-content />
    </section>
  </main>
</div>
