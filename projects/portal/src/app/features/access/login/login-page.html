<portal-access-layout labelledBy="login-title">
  <!-- Escena de la esquina inferior derecha (solo escritorio). -->
  <div accessDecor class="scene" aria-hidden="true">
    <img class="scene__leaf scene__leaf--1" src="assets/access/leaves.webp" alt="" loading="lazy" />
    <img class="scene__leaf scene__leaf--2" src="assets/access/leaves.webp" alt="" loading="lazy" />
    <img class="scene__ground" src="assets/access/ground.svg" alt="" loading="lazy" />
    <img class="scene__tree" src="assets/access/tree.webp" alt="" loading="lazy" />
    <img class="scene__woman" src="assets/access/woman.webp" alt="" loading="lazy" />
    <img class="scene__leaf scene__leaf--3" src="assets/access/leaves.webp" alt="" loading="lazy" />
    <img class="scene__leaf scene__leaf--4" src="assets/access/leaves.webp" alt="" loading="lazy" />
  </div>

  <!-- Hojas de la esquina superior izquierda (solo escritorio). -->
  <div accessDecor class="corner" aria-hidden="true">
    <img
      class="corner__leaf corner__leaf--1"
      src="assets/access/leaves.webp"
      alt=""
      loading="lazy"
    />
    <img
      class="corner__leaf corner__leaf--2"
      src="assets/access/leaves.webp"
      alt=""
      loading="lazy"
    />
  </div>

  <!-- Tras un intento fallido: microorganismos en lugar de la escena. -->
  <div accessDecor class="microbes" aria-hidden="true">
    <img
      class="microbes__img microbes__img--1"
      src="assets/access/microbes.webp"
      alt=""
      loading="lazy"
    />
    <img
      class="microbes__img microbes__img--2"
      src="assets/access/microbes.webp"
      alt=""
      loading="lazy"
    />
  </div>

  <h1 id="login-title" class="title">Ingresar al Portal</h1>
  <auth-login-form appearance="portal" [showRememberMe]="false" [returnUrl]="returnUrl()" />
  <p class="switch">
    ¿No tienes una Cuenta?
    <a routerLink="/registro">Regístrate Aquí</a>
  </p>
</portal-access-layout>
