<ul class="cards" [attr.aria-label]="groupLabel()">
  @for (item of items(); track item.id; let i = $index) {
    @let expanded = expandedId() === item.id;
    <li class="card">
      <div class="card__image">
        <img
          [src]="item.image.src"
          [alt]="item.image.alt"
          [width]="item.imageSize?.width ?? 282"
          [height]="item.imageSize?.height ?? 282"
          loading="lazy"
        />
      </div>
      <h3 class="card__title" [id]="titleId(item.id)">{{ item.title }}</h3>
      <p class="card__description">{{ item.description }}</p>
      <button
        #trigger
        type="button"
        class="card__trigger"
        [class.card__trigger--active]="expanded"
        [attr.aria-expanded]="expanded"
        [attr.aria-controls]="panelId"
        [attr.aria-label]="(expanded ? closeLabel() : openLabel()) + ': ' + item.title"
        (click)="toggle(item.id)"
        (keydown)="onTriggerKeydown($event, i)"
      >
        <svg
          class="card__trigger-icon"
          aria-hidden="true"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4.9992 12H19.0008M12 19.0008L19.0008 12L12 4.9992" />
        </svg>
      </button>

      @if (expanded && activeTemplate(); as template) {
        <div class="panel panel--inline" role="region" [attr.aria-labelledby]="titleId(item.id)">
          <ng-container [ngTemplateOutlet]="template" />
        </div>
      }
    </li>
  }
</ul>

<div
  class="panel panel--trailing"
  [class.panel--replaced]="expandedId() !== null"
  role="region"
  [id]="panelId"
  [attr.aria-labelledby]="expandedId() ? titleId(expandedId()!) : null"
  [attr.aria-label]="expandedId() ? null : groupLabel()"
>
  @if (activeTemplate(); as template) {
    <ng-container [ngTemplateOutlet]="template" />
  }
</div>
