<ul class="cards" [attr.aria-label]="groupLabel()">
  @for (item of items(); track item.id; let i = $index) {
    @let expanded = expandedId() === item.id;
    <li class="card">
      <div
        class="card__summary"
        [class.card__summary--backdrop]="!!item.backdrop"
        [style.--ui-ecg-card-backdrop]="item.backdrop ?? null"
      >
        <div class="card__image">
          <img
            [src]="item.image.src"
            [alt]="item.image.alt"
            [width]="item.imageSize?.width ?? 282"
            [height]="item.imageSize?.height ?? 282"
            loading="lazy"
          />
        </div>
        <h3 class="card__title" [id]="titleId(item.id)">{{ item.title }}</h3>
        <p class="card__description">{{ item.description }}</p>
        <button
          #trigger
          type="button"
          class="card__trigger"
          [class.card__trigger--active]="expanded"
          [attr.aria-expanded]="expanded"
          [attr.aria-controls]="inline() && !expanded ? null : panelId"
          [attr.aria-label]="(expanded ? closeLabel() : openLabel()) + ': ' + item.title"
          (click)="toggle(item.id)"
          (keydown)="onTriggerKeydown($event, i)"
        >
          <svg
            class="card__trigger-icon"
            aria-hidden="true"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M4.9992 12H19.0008M12 19.0008L19.0008 12L12 4.9992" />
          </svg>
        </button>
      </div>
      <!-- Pantallas estrechas: el panel se abre justo bajo su tarjeta. -->
      @if (inline() && expanded) {
        <ng-container [ngTemplateOutlet]="panel" />
      }
    </li>
  }
</ul>

<!-- Pantallas anchas: un único panel bajo todas las tarjetas. -->
@if (!inline()) {
  <ng-container [ngTemplateOutlet]="panel" />
}

<!-- Sin contenido activo no se pinta el panel (evita una caja vacía). -->
<ng-template #panel>
  @if (activeTemplate(); as template) {
    <div
      class="panel"
      role="region"
      [class.panel--inline]="inline()"
      [id]="panelId"
      [attr.aria-labelledby]="expandedId() ? titleId(expandedId()!) : null"
      [attr.aria-label]="expandedId() ? null : groupLabel()"
    >
      <ng-container [ngTemplateOutlet]="template" />
    </div>
  }
</ng-template>
