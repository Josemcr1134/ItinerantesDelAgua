@let c = content();
<section class="hero" [id]="sectionId" tabindex="-1" aria-labelledby="hero-title">
  <img
    class="hero__background"
    [ngSrc]="c.background.src"
    [alt]="c.background.alt"
    fill
    priority
    sizes="100vw"
  />

  <div class="hero__content">
    <h1 id="hero-title" class="hero__title">{{ c.title }}</h1>
    <p class="hero__subtitle">{{ c.subtitle }}</p>
    <ul class="hero__keywords">
      @for (keyword of c.keywords; track keyword) {
        <li>{{ keyword }}</li>
      }
    </ul>
    <a uiButton class="hero__cta" [href]="c.cta.href">{{ c.cta.label }}</a>
  </div>

  <a class="hero__scroll" pubAnchorLink [href]="c.scrollHint.href">
    <span class="visually-hidden">{{ c.scrollHint.label }}</span>
    <span class="hero__scroll-icon" aria-hidden="true"></span>
  </a>
</section>
