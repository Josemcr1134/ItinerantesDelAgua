@let c = content();
<header class="navbar" [class.navbar--scrolled]="scrolled()" [class.navbar--menu-open]="menuOpen()">
  <div class="navbar__inner">
    <a class="navbar__brand" pubAnchorLink [href]="c.homeHref" (click)="closeMenu()">
      <img [src]="c.logo.src" [alt]="c.logo.alt" width="220" height="145" fetchpriority="high" />
    </a>

    <button
      #toggle
      type="button"
      class="navbar__toggle"
      aria-controls="navbar-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="visually-hidden">{{ menuOpen() ? c.menuCloseLabel : c.menuOpenLabel }}</span>
      <span class="navbar__toggle-icon" aria-hidden="true"></span>
    </button>

    <nav
      id="navbar-menu"
      class="navbar__menu"
      [class.navbar__menu--open]="menuOpen()"
      [attr.aria-label]="c.navLabel"
    >
      <div class="navbar__menu-inner">
        <ul class="navbar__links">
          @for (link of c.links; track link.href; let i = $index) {
            <li [style.--i]="i">
              <a
                class="navbar__link"
                pubAnchorLink
                [href]="link.href"
                [attr.aria-current]="isCurrent(link.href) ? 'page' : null"
                (click)="closeMenu()"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    </nav>

    <a uiButton variant="secondary" class="navbar__cta" [href]="c.cta.href" (click)="closeMenu()">
      {{ c.cta.label }}
    </a>
  </div>
</header>
