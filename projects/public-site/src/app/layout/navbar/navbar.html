@let c = content();
<header class="navbar" [class.navbar--scrolled]="scrolled()">
  <div class="navbar__inner">
    <a class="navbar__brand" pubAnchorLink [href]="c.homeHref" (click)="closeMenu()">
      <img [src]="c.logo.src" [alt]="c.logo.alt" width="412" height="272" fetchpriority="high" />
    </a>

    <button
      #toggle
      type="button"
      class="navbar__toggle"
      aria-controls="navbar-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="visually-hidden">{{ menuOpen() ? c.menuCloseLabel : c.menuOpenLabel }}</span>
      <span class="navbar__toggle-icon" aria-hidden="true"></span>
    </button>

    <nav
      id="navbar-menu"
      class="navbar__menu"
      [class.navbar__menu--open]="menuOpen()"
      [attr.aria-label]="c.navLabel"
    >
      <ul class="navbar__links">
        @for (link of c.links; track link.href) {
          <li>
            <a class="navbar__link" pubAnchorLink [href]="link.href" (click)="closeMenu()">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <a uiButton variant="secondary" class="navbar__cta" [href]="c.cta.href" (click)="closeMenu()">
      {{ c.cta.label }}
    </a>
  </div>
</header>
