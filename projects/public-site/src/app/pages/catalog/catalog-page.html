<section class="catalog" aria-labelledby="catalog-title">
  <header class="catalog__head">
    <h1 id="catalog-title" class="catalog__title">{{ c.heading }}</h1>
    <img class="catalog__divider" [src]="c.divider.src" alt="" width="116" height="16" />
    <p class="catalog__subtitle">{{ c.subtitle }}</p>
  </header>

  <cat-offer-catalog
    [tipo]="tipo()"
    [modalidad]="modalidad()"
    [estado]="estado()"
    [beca]="beca()"
    [q]="q()"
    [topic]="topic()"
    [pagina]="pagina()"
  />
</section>

<pub-closing-cta [content]="closingCta" />
