<header class="topbar">
  <a class="topbar__brand" routerLink="/">
    <img src="assets/brand/logo-green.webp" alt="Itinerantes del Agua" width="103" height="68" />
    <span class="topbar__platform">Administrador</span>
  </a>

  @if (user(); as u) {
    <div class="topbar__user">
      <p class="topbar__name">{{ u.fullName }}</p>
      <p class="topbar__roles">{{ roles() }}</p>
    </div>
  }

  <button type="button" class="topbar__logout" (click)="logout()">
    <svg
      aria-hidden="true"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
    </svg>
    Cerrar sesión
  </button>
</header>

<main class="content">
  <router-outlet />
</main>
